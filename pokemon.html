<!DOCTYPE html>
    <html lang="en" data-theme="dark">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Pokédex | Poke World</title>

        <link rel="stylesheet" href="pokemon.css">
        <link rel="stylesheet" href="style.css">
        <script src="theme.js" defer></script>
        <script src="pokemon.js" defer></script>
    </head>
<body>
    <header class="site-header">
        <a class="brand" href="index.html">
            <span class="pokeball" aria-hidden="true"></span>
            POKE<span class="brand-accent">WORLD</span>
        </a>

        <nav class="main-nav" aria-label="Main navigation">
    <a href="index.html">Home</a>
    <a href="pokemon.html" aria-current="page">Pokédex</a>
    <a href="trainer.html">Trainers</a>
    <a href="battle.html">Battle Lab</a>
    <a href="dashboard.html">Dashboard</a>
</nav>

        <div class="header-actions">
            <button
                    class="theme-toggle"
                    id="theme-toggle"
                    type="button"
                    aria-label="Switch to light theme"
                    aria-pressed="false"
            >☼</button>
        </div>
    </header>

    <main class="container page-content">
        <section class="section-heading"><h1>Pokédex</h1><p>Explore Pokémon by name, type, and base stats.</p></section>
<div class="search-sort-row">
            <input type="search" id="search-input" aria-label="Search Pokémon by name" placeholder="Search Pokémon by name...">
            <select id="sort-select" aria-label="Sort Pokémon">
                <option value="default">Sort by: Pokédex number</option>
                <option value="hp">HP (low to high)</option>
                <option value="hp-desc">HP (high to low)</option>
                <option value="attack">Attack (low to high)</option>
                <option value="attack-desc">Attack (high to low)</option>
                <option value="defence">Defence (low to high)</option>
                <option value="defence-desc">Defence (high to low)</option>
            </select>
        </div>
        <div id="type-filter"></div>
        <!--kort grid system-->
        <div class="card-grid" id="pokemon-grid">
            
        </div>
    </main>

    <footer class="site-footer">
        <a class="brand" href="index.html">
            POKE<span class="brand-accent">WORLD</span>
        </a>
    </footer>
    </body>
    </html>
